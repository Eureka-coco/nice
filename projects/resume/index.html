function navigateTo(step) {
  state.currentStep = step;
  document.querySelectorAll('.step-item').forEach(el => {
    const s = parseInt(el.dataset.step);
    el.classList.remove('active','done');
    if (s === step) el.classList.add('active');
    if (s < step) el.classList.add('done');
  });
  renderPage(step);
  document.getElementById('mainContent').scrollIntoView({ behavior:'smooth' });
}

function fillExampleData() {
  state.input = JSON.parse(JSON.stringify(exampleData));
  renderPage(1);
  showToast('✅ 已填充示例数据（基于预设案例素材：01AI 实习 + Tidyo APP + 智慧园区项目）');
}

function saveInput() {
  ['inpRole','inpIndustry','inpCompany','inpStage','inpAbilities','inpJD','inpResume','inpExtra'].forEach(id => {
    const el = document.getElementById(id); if (el) state.input[id.replace('inp','').toLowerCase()] = el.value;
  });
  state.input.targetRole = document.getElementById('inpRole')?.value || '';
  state.input.jd = document.getElementById('inpJD')?.value || '';
  state.input.resume = document.getElementById('inpResume')?.value || '';
  state.input.extraInfo = document.getElementById('inpExtra')?.value || '';
}

function startAnalysis() {
  saveInput();
  if (!state.input.jd.trim() || !state.input.resume.trim()) { showToast('⚠️ 请至少填写目标 JD 和原始简历'); return; }
  const s = document.getElementById('analysisStatus');
  if (s) s.innerHTML = '<div class="alert alert-info"><span class="loading-dots"><span></span><span></span><span></span></span> 正在载入预设分析样例，请稍候...</div>';
  setTimeout(() => {
    generateMockResults();
    state.analysisDone = true; state.activeStyle = 'balanced';
    if (s) s.innerHTML = '<div class="alert alert-success">✅ 预设分析样例已载入！请点击左侧流程查看各步骤结果</div>';
    document.querySelectorAll('.step-item').forEach(el => { const x = parseInt(el.dataset.step); if (x===1) { el.classList.add('done'); el.classList.remove('active'); } });
    navigateTo(2);
  }, 1500);
}

    '<div class="section-title">✨ 简历优化</div><div class="section-desc">逐段优化简历表达。标注了【待补充】的内容不会编造——需要你自行填写。<br><span style="color:var(--danger);font-size:12px;">⚠️ 所有修改严格基于你的真实经历，不确定处已标注【待确认】。</span></div>'+
    '<div class="card"><div class="card-title mb-8">优化风格</div><div class="btn-group mt-8">'+Object.entries(labels).map(([k,v]) => '<button class="style-btn'+(state.activeStyle===k?' on':'')+'" onclick="switchStyle(\''+k+'\')">'+v+'</button>').join('')+'</div></div>'+
    '<div class="card"><div class="card-title mb-16">修改对照表</div>'+state.optimizationResults.map(r => '<div class="diff-row"><div><div class="diff-label before">修改前</div><div class="diff-text before">'+r.before+'</div></div><div><div class="diff-label after">修改后</div><div class="diff-text after">'+r.after+'</div><div class="diff-reason">📌 '+r.reason+'</div>'+(r.risk?'<div class="diff-risk">⚠️ '+r.risk+'</div>':'')+'</div></div>').join('')+'</div>';
}

function switchStyle(style) {
  state.activeStyle = style;
  const orig = state._originalOptimization;
  if (style === 'balanced') { state.optimizationResults = JSON.parse(JSON.stringify(orig)); }
  else if (style === 'concise') { state.optimizationResults = orig.map(r => ({...r, after: r.after.replace(/（[^）]+）/g,'').replace(/【[^】]+】/g,'【待补充】').replace(/\s+/g,' ').trim()})); }
  else if (style === 'conservative') { state.optimizationResults = orig.map(r => ({...r, after: r.after.replace(/独立完成/g,'参与完成').replace(/独立/g,'在指导下').replace(/负责/g,'参与')})); }
  else if (style === 'ai') { state.optimizationResults = orig.map(r => ({...r, after: r.after.replace(/产品/g,'AI 产品').replace(/需求/g,'AI 场景需求')})); }
  else if (style === 'tob') { state.optimizationResults = orig.map(r => ({...r, after: r.after.replace(/用户/g,'企业客户').replace(/产品设计/g,'SaaS 产品设计')})); }
  renderPage(6);
  showToast('✅ 已切换至"'+({balanced:'均衡优化',concise:'更简洁',conservative:'降低夸张',ai:'更偏 AI 产品',tob:'更偏 ToB SaaS'}[style])+'"风格');
}

// ===== Step 7: 面试准备 =====
function renderStep7(container) {
  if (!state.analysisDone) { container.innerHTML = '<div class="empty-state"><div class="icon">🎯</div><p>请先在"输入材料"中点击"开始分析"</p><button class="btn btn-primary mt-16" onclick="navigateTo(1)">返回输入材料</button></div>'; return; }
  const p = state.interviewPrep;
  container.innerHTML =
    '<div class="section-title">🎯 面试准备</div><div class="section-desc">面试官可能追问的问题、需要准备的证据和风险提示</div>'+
    '<div class="card"><div class="card-title mb-16">🔴 可能被追问的 10 个问题</div>'+p.possibleQuestions.map((item,idx) => '<div class="interview-q"><div class="q-label">问题 '+(idx+1)+'</div><div class="q-body">'+item.q+'</div><div class="q-tip">💡 '+item.tip+'</div></div>').join('')+'</div>'+
    '<div class="card"><div class="card-title mb-8">📋 需要准备的证据材料</div><ul style="padding-left:20px;">'+p.evidenceNeeded.map(e => '<li style="margin-bottom:6px;font-size:13px;">'+e+'</li>').join('')+'</ul></div>'+
    '<div class="card"><div class="card-title mb-16">⚠️ 可能显得夸大的表达</div><div class="table-wrap"><table><thead><tr><th>表述</th><th>风险</th><th>建议</th></tr></thead><tbody>'+p.exaggeratedRisks.map(e => '<tr><td>'+e.expression+'</td><td>'+e.risk+'</td><td>'+e.suggestion+'</td></tr>').join('')+'</tbody></table></div></div>'+
    '<div class="card"><div class="card-title mb-8">📊 建议补充的数据/证据</div><ul style="padding-left:20px;">'+p.suggestedData.map(d => '<li style="margin-bottom:6px;font-size:13px;">'+d+'</li>').join('')+'</ul></div>'+
    '<div class="card"><div class="card-title mb-8">🎤 自我介绍（建议版）</div><div style="background:var(--bg);padding:16px;border-radius:var(--radius-sm);font-size:13px;line-height:2;white-space:pre-wrap;">'+p.selfIntro+'</div></div>';
}

// ===== Step 8: 导出结果 =====
function renderStep8(container) {
  if (!state.analysisDone) { container.innerHTML = '<div class="empty-state"><div class="icon">📦</div><p>请先在"输入材料"中点击"开始分析"</p><button class="btn btn-primary mt-16" onclick="navigateTo(1)">返回输入材料</button></div>'; return; }
  const r = state.finalResume;
  container.innerHTML =
    '<div class="section-title">📦 最终简历 & 导出</div><div class="section-desc">完整优化版简历，基于真实经历改写。<mark>标注【待补充】处不会编造——需要你自行填写。</mark></div>'+
    '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><div class="card-title">完整优化版简历</div><button class="btn btn-primary btn-sm" onclick="copyFinalResume()">📋 复制到剪贴板</button></div>'+
    '<div class="resume-preview"><div class="resume-header"><h2>'+r.name+'</h2><p>📞 '+r.phone+' &nbsp;|&nbsp; 📧 '+r.email+'</p><p style="font-weight:600;">'+r.target+'</p></div>'+
    '<h3>职业摘要</h3><p style="font-size:13px;">'+r.summary+'</p>'+
    '<h3>核心能力</h3><ul>'+r.coreAbilities.map(a => '<li>'+a+'</li>').join('')+'</ul>'+
    '<h3>实习经历</h3>'+r.experience.map(exp => '<div class="exp-item"><div class="exp-title"><span>'+exp.company+' | '+exp.title+'</span><span>'+exp.date+'</span></div><ul>'+exp.bullets.map(b => '<li>'+b+'</li>').join('')+'</ul></div>').join('')+
    '<h3>项目经历</h3>'+r.projects.map(proj => '<div class="exp-item"><div class="exp-title"><span>'+proj.title+'</span><span>'+proj.date+'</span></div><div class="exp-sub">'+proj.role+'</div><ul>'+proj.bullets.map(b => '<li>'+b+'</li>').join('')+'</ul></div>').join('')+
    '<h3>技能工具</h3><p style="font-size:13px;">'+r.skills+'</p>'+
    '<h3>教育背景</h3><p style="font-size:13px;">'+r.education+'</p></div></div>'+
    '<div class="card"><div class="card-title mb-8">导出选项</div><p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px;">导出功能为 Demo 占位，后续可接入真实导出（PDF/Word/在线链接）</p>'+
    '<div class="btn-group"><button class="btn btn-primary" onclick="copyFinalResume()">📋 复制文本到剪贴板</button><button class="btn btn-secondary" onclick="showToast(\'🚧 PDF 导出功能开发中，敬请期待\')">📄 导出 PDF</button><button class="btn btn-secondary" onclick="showToast(\'🚧 Word 导出功能开发中，敬请期待\')">📝 导出 Word</button></div></div>';
}

function copyFinalResume() {
  const r = state.finalResume;
  const text = [
    r.name, '📞 '+r.phone+' | 📧 '+r.email, '求职意向：'+r.target, '', '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', '',
    '【职业摘要】', r.summary, '',
    '【核心能力】', ...r.coreAbilities.map(a => '• '+a), '',
    '【实习经历】', ...r.experience.map(exp => [exp.company+' | '+exp.title+' | '+exp.date, ...exp.bullets.map(b => '• '+b), ''].join('\n')),
    '【项目经历】', ...r.projects.map(proj => [proj.title+' | '+proj.role+' | '+proj.date, ...proj.bullets.map(b => '• '+b), ''].join('\n')),
    '【技能工具】', r.skills, '',
    '【教育背景】', r.education
  ].join('\n').trim();
  navigator.clipboard.writeText(text).then(() => showToast('✅ 已复制到剪贴板')).catch(() => showToast('⚠️ 复制失败，请手动选择文本复制'));
}

// ===== 工具函数 =====
function esc(str) { if (!str) return ''; return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timeout); t._timeout = setTimeout(() => t.classList.remove('show'), 2500); }

// ===== 侧边栏点击 =====
document.getElementById('stepList').addEventListener('click', (e) => {
  const item = e.target.closest('.step-item');
  if (!item) return;
  const step = parseInt(item.dataset.step);
  if (step > 2 && !state.analysisDone) { showToast('⚠️ 请先在"输入材料"中点击"开始分析"'); return; }
  navigateTo(step);
});

// ===== 初始化 =====
navigateTo(1);
</script>
</body>
</html>
